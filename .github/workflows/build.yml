name: build
on: [push, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libfuse2 libgl1-mesa-dev libxcb-cursor0 ninja-build
      - uses: jurplel/install-qt-action@v4
        with: { version: 6.7.3, cache: true }
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - uses: actions/upload-artifact@v4
        with: { name: nicominecith-x11-linux, path: build/nicominecith-x11 }
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with: { version: 6.7.3, arch: win64_msvc2019_64, cache: true }
      - uses: ilammy/msvc-dev-cmd@v1
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          mkdir dist; copy build\nicominecith-x11.exe dist\
          windeployqt --qmldir qml dist\nicominecith-x11.exe
      - uses: actions/upload-artifact@v4
        with: { name: nicominecith-x11-windows, path: dist }
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: jurplel/install-qt-action@v4
        with: { version: 6.7.3, host: linux, target: desktop, cache: true }
      - uses: jurplel/install-qt-action@v4
        with: { version: 6.7.3, host: linux, target: android, arch: android_arm64_v8a, set-env: false, cache: true }
      - run: |
          sudo apt-get install -y ninja-build
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" || true
          find $ANDROID_HOME/platforms -mindepth 1 -maxdepth 1 ! -name android-34 -exec sudo rm -rf {} +
          export ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME ANDROID_SDK_ROOT=$ANDROID_HOME
          QTA=$(dirname $QT_ROOT_DIR)/android_arm64_v8a
          mkdir -p android/res/drawable
          cp assets/icon.png android/res/drawable/icon.png
          T=$QTA/src/android/templates/AndroidManifest.xml
          if [ -f "$T" ]; then cp "$T" android/AndroidManifest.xml; sed -i 's|<application |<application android:icon="@drawable/icon" |' android/AndroidManifest.xml; fi
          $QTA/bin/qt-cmake -G Ninja -B build-android -DQT_HOST_PATH=$QT_ROOT_DIR -DANDROID_SDK_ROOT=$ANDROID_HOME \
            -DCMAKE_BUILD_TYPE=Release -DQT_ANDROID_BUILD_ALL_ABIS=OFF -DQT_ANDROID_TARGET_SDK_VERSION=34
          cmake --build build-android --target apk
      - run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find build-android -name "*release-unsigned.apk" | head -1)
          keytool -genkeypair -keystore ks.jks -storepass nicopass -keypass nicopass -alias nico -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nicominecith"
          $BT/zipalign -f -p 4 "$APK" aligned.apk
          mkdir -p signed
          $BT/apksigner sign --ks ks.jks --ks-pass pass:nicopass --key-pass pass:nicopass --out signed/nicominecith-x11.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with: { name: nicominecith-x11-apk, path: signed/nicominecith-x11.apk }
